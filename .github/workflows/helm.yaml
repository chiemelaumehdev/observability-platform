name: helm

on:
  push:
    branches: [main]
    paths:
      - "clusters/**"
      - ".github/workflows/helm.yaml"
  pull_request:
    branches: [main]
    paths:
      - "clusters/**"
      - ".github/workflows/helm.yaml"

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: default
            rules:
              line-length: {max: 160}
              document-start: disable
              truthy:
                check-keys: false

  argocd-manifest-validate:
    name: argocd manifest validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
      - name: validate against Kubernetes schemas
        run: |
          find clusters -name "*.yaml" -not -path "*/dashboards/*" -not -path "*/alert-rules/*" \
            -exec kubeconform -strict -ignore-missing-schemas -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/crds/{{.ResourceKind}}-{{.ResourceAPIVersion}}.json' {} +
