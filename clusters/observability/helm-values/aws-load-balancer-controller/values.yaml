clusterName: observability-eks
region: us-east-1
vpcId: ""

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::445817183428:role/observability-alb-controller-irsa

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Create the ALB IngressClass. No ingress group — each Ingress gets its
# own ALB. Later, if multiple services share one ALB, give them matching
# alb.ingress.kubernetes.io/group.name annotations instead.
ingressClass: alb
createIngressClassResource: true
ingressClassParams:
  create: true
  spec: {}

enableServiceMutatorWebhook: false

# Use cert-manager (already installed) to issue + rotate the webhook
# TLS cert. Default is a self-signed CA that the kube-apiserver rejects
# with "certificate signed by unknown authority" when calling the mutate
# and validate webhooks on TargetGroupBinding / Ingress.
enableCertManager: true
