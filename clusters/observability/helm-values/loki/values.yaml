deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: observability-loki-blocks-445817183428-us-east-1
      ruler: observability-loki-blocks-445817183428-us-east-1
      admin: observability-loki-blocks-445817183428-us-east-1
    s3:
      region: us-east-1
      endpoint: s3.us-east-1.amazonaws.com
      insecure: false
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp2
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  extraArgs:
    - -config.expand-env=true

serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::445817183428:role/observability-loki-irsa

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

minio:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

test:
  enabled: false

monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
