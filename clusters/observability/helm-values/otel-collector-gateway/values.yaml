mode: deployment
replicaCount: 2

image:
  repository: otel/opentelemetry-collector-contrib

serviceAccount:
  create: true
  name: otel-collector-gateway

presets:
  logsCollection:
    enabled: false
  kubernetesAttributes:
    enabled: false

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 1s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 1s
      limit_mib: 400
      spike_limit_mib: 100
    resource:
      attributes:
        - key: cluster.name
          value: observability-eks
          action: upsert
    attributes/redact:
      actions:
        - key: http.request.body
          action: delete
        - key: http.request.body.content
          action: delete
        - key: db.statement
          action: delete
        - key: user.email
          action: hash
        - key: enduser.id
          action: hash

  connectors:
    spanmetrics:
      # Finer bucket set for quantile precision. Default OTel buckets are
      # too sparse at the tail; a P99 of "9500ms" could be anywhere from
      # 5s to 10s under the old [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s].
      histogram:
        explicit:
          buckets:
            [1ms, 5ms, 10ms, 25ms, 50ms, 75ms, 100ms, 250ms, 500ms, 750ms,
             1s, 1500ms, 2s, 2500ms, 5s, 7500ms, 10s, 15s, 30s]
      # Promote span + resource attributes to metric labels so prod
      # dashboards can slice by them. Each entry becomes a label on
      # traces_span_metrics_calls_total / _duration_milliseconds_*.
      # Keep this list tight — every added dimension multiplies cardinality.
      dimensions:
        # HTTP semantics - carry BOTH the v1.26+ names (new app) and the
        # v1.19 names (current running app). The otelhttp instrumentation
        # version determines which pair actually gets emitted on the span;
        # listing both keeps the metric labels working across the rolling
        # upgrade without the dashboard needing to flip filters.
        - name: http.request.method
        - name: http.response.status_code
        - name: http.route
        - name: http.method
        - name: http.status_code
        # Resource attributes propagated from the SDK Resource. These are
        # the dashboard variable surface: $env, $version, $cluster.
        - name: deployment.environment.name
        - name: service.version
        - name: cluster.name
      # Attach the trace ID as an exemplar on every histogram bucket.
      # Required for the "click a slow point → jump to the trace" flow
      # on latency panels in Grafana.
      exemplars:
        enabled: true
      metrics_flush_interval: 15s

  exporters:
    debug:
      verbosity: basic
    otlp/tempo:
      endpoint: tempo:4317
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: http://loki-gateway/otlp
      tls:
        insecure: true
    prometheusremotewrite/mimir:
      endpoint: http://mimir-nginx/api/v1/push
      tls:
        insecure: true
    kafka/traces:
      brokers:
        - kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
      topic: otel.traces
      encoding: otlp_proto
    kafka/metrics:
      brokers:
        - kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
      topic: otel.metrics
      encoding: otlp_proto
    kafka/logs:
      brokers:
        - kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
      topic: otel.logs
      encoding: otlp_proto

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource, attributes/redact, batch]
        exporters: [debug, otlp/tempo, spanmetrics, kafka/traces]
      metrics:
        receivers: [otlp, spanmetrics]
        processors: [memory_limiter, resource, batch]
        exporters: [prometheusremotewrite/mimir, kafka/metrics]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, resource, attributes/redact, batch]
        exporters: [otlphttp/loki, kafka/logs]
    telemetry:
      logs:
        level: info
