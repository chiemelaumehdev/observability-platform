replicas: 2

image:
  repository: grafana/grafana
  tag: "11.2.2"

adminUser: admin
adminPassword: changeme

env:
  GF_DATABASE_TYPE: postgres
  GF_DATABASE_SSL_MODE: require

envValueFrom:
  GF_DATABASE_HOST:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_HOST
  GF_DATABASE_NAME:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_NAME
  GF_DATABASE_USER:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_USER
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_PASSWORD

grafana.ini:
  server:
    root_url: "http://localhost:3000"
  analytics:
    reporting_enabled: false
    check_for_updates: false
  users:
    allow_sign_up: false
  auth.anonymous:
    enabled: false
  log:
    mode: console
    level: info

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo:3100
        isDefault: true
        jsonData:
          httpMethod: GET

persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: grafana

testFramework:
  enabled: false
