replicas: 2

image:
  repository: grafana/grafana
  tag: "11.2.2"

adminUser: admin
adminPassword: changeme

env:
  GF_DATABASE_TYPE: postgres
  GF_DATABASE_SSL_MODE: require

envValueFrom:
  GF_DATABASE_HOST:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_HOST
  GF_DATABASE_NAME:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_NAME
  GF_DATABASE_USER:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_USER
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_PASSWORD

grafana.ini:
  server:
    root_url: "http://localhost:3000"
  analytics:
    reporting_enabled: false
    check_for_updates: false
  users:
    allow_sign_up: false
  auth.anonymous:
    enabled: false
  log:
    mode: console
    level: info

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo:3100
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: mimir
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"
          serviceMap:
            datasourceUid: mimir
      - name: Mimir
        type: prometheus
        uid: mimir
        access: proxy
        url: http://mimir-nginx/prometheus
        isDefault: true
        jsonData:
          httpMethod: POST
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: 'trace_id=(\w+)'
              datasourceUid: tempo
              url: '$${__value.raw}'

persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Fronted by an AWS ALB managed by the AWS Load Balancer Controller.
# ALB is the right choice over NLB for a browser-facing UI because it:
#   - terminates HTTPS natively (ACM cert on a listener)
#   - redirects HTTP->HTTPS as a listener rule
#   - supports path/host-based routing (one ALB -> many services later)
#   - integrates with WAF for OWASP protection
#   - writes access logs with full HTTP context (method, path, UA)
# NLB only wins for raw TCP/UDP or extreme throughput, neither of
# which Grafana needs.
ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
  # No hosts: the ALB catches any Host header. The chart's default
  # chart-example.local placeholder would prevent the browser (hitting
  # the ALB's auto-generated DNS name) from ever matching a rule.
  hosts: []
  path: /
  pathType: Prefix

serviceAccount:
  create: true
  name: grafana

testFramework:
  enabled: false
