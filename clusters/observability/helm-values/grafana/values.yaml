replicas: 2

image:
  repository: grafana/grafana
  tag: "11.2.2"

adminUser: admin
adminPassword: changeme

env:
  GF_DATABASE_TYPE: postgres
  GF_DATABASE_SSL_MODE: require

envValueFrom:
  GF_DATABASE_HOST:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_HOST
  GF_DATABASE_NAME:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_NAME
  GF_DATABASE_USER:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_USER
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-db
      key: GF_DATABASE_PASSWORD

grafana.ini:
  server:
    root_url: "http://localhost:3000"
  analytics:
    reporting_enabled: false
    check_for_updates: false
  users:
    allow_sign_up: false
  auth.anonymous:
    enabled: false
  log:
    mode: console
    level: info

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo:3100
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: mimir
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"
          serviceMap:
            datasourceUid: mimir
      - name: Mimir
        type: prometheus
        uid: mimir
        access: proxy
        url: http://mimir-nginx/prometheus
        isDefault: true
        jsonData:
          httpMethod: POST
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: 'trace_id=(\w+)'
              datasourceUid: tempo
              url: '$${__value.raw}'

persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

serviceAccount:
  create: true
  name: grafana

testFramework:
  enabled: false
