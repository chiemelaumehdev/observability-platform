apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-db-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: observability
  source:
    repoURL: https://github.com/chiemelaumehdev/observability-platform.git
    targetRevision: main
    path: clusters/observability/manifests/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
